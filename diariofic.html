<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Diário Fic</title>

     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
     <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

     <style>

        .imagecolor{
            background-color: rgb(0, 0, 80);
        }

        .imagelogin{
            background-image: url("imagem/paisagemurbana.jpg");
            background-size: cover;
            background-repeat: no-repeat;
            height: 100vh;
        }

        .imagens{
            width: 60%;
        }

     </style>
</head>
<body>
    <div class="container-fluid imagecolor">
        <div class="row">
            <div class="col-lg-4 text-white justify-content-center align-content-center text-center my-5">
                <img class="imagens" src="imagem/senai-logo.png" alt="senai-logo">

                <h3 class="fw-bold py-5">DIÁRIO FIC</h3>

                <img class="imagens" src="imagem/process-verify.svg" alt="process-verify">
            </div>

            <div class="col-lg-8 imagelogin align-content-center">
                <div class="container bg-white w-75 px-5 py-4 rounded-4">
                    <div class="row">
                        <span class="fw-bold h3 my-4">Entrar</span>

                        <span class="mt-3">NIF</span>
                        <input class="d-block bg-body-secondary border border-0 rounded-3 w-100 py-3 my-2" type="text">

                        <span class="mt-3">Senha</span>
                        <input class="d-block bg-body-secondary border border-0 rounded-3 w-100 py-3 my-2" type="password">

                        <a class="text-secondary mb-4" href="#">Esqueci minha senha</a>

                        <a class="btn btn-info text-white imagecolor border-0 py-3 px-5" href="#">Entrar</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</body>
</html>
